<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" fill="none" class="brand-logo">
  <defs>
    <linearGradient id="concise-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Concise.ai Circular C & Green Flow Core Emblem -->
  <g transform="translate(6, 6) scale(0.78)">
    <!-- Outer C Arc: Thick circular ring with opening on right and rounded caps -->
    <path d="M 37.5 13.5
             A 22 22 0 1 0 37.5 37.5
             A 4.5 4.5 0 0 0 32 31
             A 13 13 0 1 1 32 20
             A 4.5 4.5 0 0 0 37.5 13.5 Z"
          fill="url(#concise-c-grad)" />

    <!-- Inner Vibrant Green Flow / Leaf Core -->
    <path d="M 23 18
             C 18.5 18 15 21.5 15 25.5
             C 15 29.5 18.5 33 23 33
             C 27.5 33 30.5 31.5 33.5 29.5
             C 36.5 27.5 39.5 29 41 31
             C 42 27 42 24 41 20
             C 39.5 22 36.5 23.5 33.5 21.5
             C 30.5 19.5 27.5 18 23 18 Z"
          fill="#00c853"
          filter="url(#green-glow)" />
  </g>

  <!-- Wordmark: CONCISE AI in Bold Modern High-Contrast Typography -->
  <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif">
    <text x="54" y="34" font-size="20" font-weight="900" letter-spacing="0.08em">CONCISE</text>
    <text x="175" y="34" font-size="20" font-weight="900" fill="#00c853" letter-spacing="0.08em">AI</text>
  </g>
</svg>
